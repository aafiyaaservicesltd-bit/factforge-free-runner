name: FactForge free runner

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: factforge-free-runner
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FACTFORGE_URL: https://factforge-ai.stony-dove-6282.chatgpt.site
      OLLAMA_MODEL: qwen2.5:3b
      PIPER_VOICE: en_US-ljspeech-high
      PIPER_DATA_DIR: /tmp/piper-voices
      SADTALKER_DIR: ${{ github.workspace }}/.cache/SadTalker
      HOST_ANIMATOR: sadtalker
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out runner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sadtalker-requirements.txt

      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen25-3b-v1

      - name: Cache lifelike presenter
        uses: actions/cache@v4
        with:
          path: ${{ env.SADTALKER_DIR }}
          key: sadtalker-animated-presenter-v1

      - name: Install free local tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core git
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check \
            torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r sadtalker-requirements.txt
          if [ ! -f "$SADTALKER_DIR/inference.py" ]; then
            mkdir -p "$(dirname "$SADTALKER_DIR")"
            git clone --depth 1 https://github.com/OpenTalker/SadTalker.git "$SADTALKER_DIR"
          fi
          mkdir -p "$SADTALKER_DIR/checkpoints"
          if [ ! -s "$SADTALKER_DIR/checkpoints/SadTalker_V0.0.2_256.safetensors" ]; then
            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/SadTalker_V0.0.2_256.safetensors \
              -o "$SADTALKER_DIR/checkpoints/SadTalker_V0.0.2_256.safetensors"
          fi
          if [ ! -s "$SADTALKER_DIR/checkpoints/mapping_00109-model.pth.tar" ]; then
            curl --proto '=https' --tlsv1.2 -fL --retry 3 \
              https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc/mapping_00109-model.pth.tar \
              -o "$SADTALKER_DIR/checkpoints/mapping_00109-model.pth.tar"
          fi
          curl --proto '=https' --tlsv1.2 -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$PIPER_DATA_DIR"
          python -m piper.download_voices --data-dir "$PIPER_DATA_DIR" "$PIPER_VOICE"

      - name: Start local Qwen model
        shell: bash
        run: |
          set -euo pipefail
          ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Run one guarded production job
        run: python runner.py
